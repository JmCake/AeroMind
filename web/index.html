<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#142e32"><title>AeroMind · 智航纪元</title>
  <link rel="icon" href="data:,"><link rel="stylesheet" href="/app/style.css">
  <script type="importmap">{"imports":{"three":"/three/three.module.js","three/addons/":"/addons/"}}</script>
</head>
<body>
<header>
  <div class="brand"><i class="wing"></i><div><strong>AeroMind</strong><small>智航纪元</small></div></div>
  <nav aria-label="应用模式">
    <button data-mode="course" class="selected">课程</button><button data-mode="free">自由配送</button>
    <button data-mode="challenge">现场挑战</button><button data-mode="experiment">对照实验</button>
  </nav>
  <span id="connection" class="status"><i></i>连接本机服务</span>
</header>
<main>
 <section id="world" aria-label="实时三维城市">
   <div class="map-title"><span class="eyebrow">CAMPUS DISTRICT</span><h1>云港学区</h1></div>
   <div class="map-stats"><span id="clock">00:00</span><small>仿真时间</small></div>
   <div id="stage-tip" role="status">正在载入三维城市与机载相机…</div>
   <div class="views" aria-label="观察视角">
    <button data-view="overview" class="selected">总览</button><button data-view="follow">跟随</button>
    <button data-view="fpv">机载</button><button data-view="map">认知</button><button data-view="cinema">运镜</button>
   </div>
 </section>
 <aside>
  <section class="card order">
    <div class="section-line"><span class="eyebrow">DISPATCH</span><span id="unit-name">AM–01</span></div>
    <h2>配送任务</h2>
    <label class="field">配送站点<select id="station"><option value="17">图书馆 · 屋顶站台</option><option value="31">居民区 · 服务站</option></select></label>
    <div class="chapter field"><label for="chapter">课程章节</label><select id="chapter">
      <option value="1">01 · 航线自动化</option><option value="2">02 · 视觉感知</option><option value="3">03 · 空间理解</option>
      <option value="4" selected>04 · 主动观察与预测</option><option value="5">05 · 协同配送</option>
    </select></div>
    <button class="launch" id="launch" disabled><span>开始配送</span><b aria-hidden="true">↗</b></button>
    <div class="telemetry"><div><small>任务状态</small><strong id="phase">等待订单</strong></div><div><small>飞行里程</small><strong id="travel">0 m</strong></div><div><small>剩余电量</small><strong id="energy">100%</strong></div></div>
  </section>
  <section class="card optical">
    <div class="section-line"><h3>机载视觉</h3><span id="frame-num">F —</span></div>
    <div class="feed"><canvas id="feed" aria-label="机载原始图像"></canvas><canvas id="detections" width="320" height="180" aria-label="检测框和置信度"></canvas><i class="cross"></i></div>
    <div class="percept"><i></i><span id="percept">等待第一帧</span></div>
    <dl><div><dt>定位来源</dt><dd id="fix">初始停机位</dd></div><div><dt>前向距离</dt><dd id="range">—</dd></div><div><dt>图像往返</dt><dd id="latency">—</dd></div></dl>
  </section>
  <details class="card" id="controls"><summary>环境与驾驶</summary>
    <label class="field">环境<select id="weather"><option value="day">日照</option><option value="fog">薄雾</option><option value="night">夜间</option><option value="rain">阴雨与阵风</option></select></label>
    <div class="switches"><label><input type="checkbox" id="barrier">通道施工</label><label><input type="checkbox" id="moving">吊臂摆动</label>
      <label><input type="checkbox" id="occupied">占用站台</label><label><input type="checkbox" id="zone">南侧限飞</label>
      <label><input type="checkbox" id="gps" checked>GPS 更新</label><label><input type="checkbox" id="fleet">双机配送</label>
      <label><input type="checkbox" id="manual">手动接管</label></div>
    <p class="hint" id="drive-hint" hidden>WASD 平移，Q/E 升降。解除接管后恢复任务。</p>
    <label class="field">任务指令<input id="command" placeholder="将包裹送到图书馆指定平台"></label>
    <button id="parse" class="secondary">应用指令</button>
  </details>
  <details class="card" id="knowledge"><summary>认知地图与决策</summary>
    <canvas id="cognitive" width="300" height="170" aria-label="观测体素俯视图"></canvas>
    <p class="legend">深灰 未知　青色 通行　琥珀 占用　灰绿 不确定</p><p id="rationale" class="hint">等待地图更新</p>
  </details>
  <details class="card" id="experiment"><summary>实验与协作</summary>
    <button id="compare" class="secondary">比较主动观察开 / 关</button><p id="compare-state" class="hint">相同初始条件和施工事件，各次运行独立取帧。</p>
    <button id="switch-unit" class="secondary" disabled>切换观测无人机</button><p id="fleet-state" class="hint">单机运行</p>
    <label class="field">关键帧回放<input aria-label="回放时间" id="replay-time" type="range" min="0" max="0" value="0" step="0.2"></label>
    <div id="replay" hidden><div class="replay-pair"></div><p id="replay-caption" class="hint"></p></div>
    <button id="export" class="secondary">导出运行证据</button>
  </details>
 </aside>
</main>
<footer>
 <div class="timeline"><span class="eyebrow">任务时间轴</span><div id="events" aria-live="polite">等待选择订单</div></div>
 <div class="transport"><button id="pause" disabled>暂停</button><button id="speed">1×</button><button id="reset">重置</button></div>
</footer>
<script type="module" src="/app/main.js"></script>
</body></html>
